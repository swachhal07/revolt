<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Revolt Nepal</title>
  <!--
    The Revolt diamond, traced from the master logo (new-logo-1.png) rather than
    redrawn by eye: the two halves below are the mark's own outlines, simplified
    to 22 and 18 points and checked back against the source bitmap at 0.73%
    pixel difference — which is the antialiasing on the edges and nothing else.

    Transparent ground, so the mark sits directly on whatever chrome the browser
    paints. That is the reason for the media query rather than a fixed fill: the
    mark is ink-black like the rest of the site, and ink on a dark tab strip is
    an empty square. Firefox and Chrome honour `prefers-color-scheme` inside an
    SVG favicon, so it flips to white when the browser is in a dark theme; any
    browser that ignores it falls back to the black declared on the group, which
    is the correct colour for the light chrome those browsers are showing.

    The 0.84 scale takes the mark to 92% of the canvas. It carried 74% while it
    sat on a red tile, where the tile supplied the padding — with the tile gone
    that margin is just wasted resolution at the 16px size this is read at.
  -->
  <style>
    .mark { fill: #121214; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #ffffff; }
    }
  </style>
  <g class="mark" transform="translate(20.5 120.8) scale(0.8396)">
    <path d="M265 -0.5L84 101.5L82 101.5L14 139.5L4.5 147L0.5 154L-0.5 160L0.5 167L3.5 173L11 179.5L267 321.5L267 193.5L211 193.5L210 222.5L98.5 161L99 159.5L109 153.5L210 98.5L211 126.5L267 126.5L267.5 0L265 -0.5Z"/>
    <path d="M294 -0.5L292.5 1L293 126.5L349 126.5L350 97.5L462.5 160L351 222.5L349.5 222L349 193.5L293 193.5L293 321.5L548 180.5L557.5 172L560.5 165L560.5 156L557.5 149L548 140.5L294 -0.5Z"/>
  </g>
</svg>
